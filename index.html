<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Administrasi & Arsip Sekolah — SDIT Annihayah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <img src="https://i.imgur.com/6iC3xQb.png" alt="Logo SDIT Annihayah" class="login-logo" onerror="this.style.display='none'">
    <h1 class="login-title">SDIT Annihayah</h1>
    <p class="login-subtitle">Sistem Administrasi & Arsip Sekolah</p>
    <form id="login-form" class="login-form">
      <label class="field-label">Username</label>
      <input type="text" id="login-username" class="field-input" placeholder="Masukkan username" required>
      <label class="field-label">Password</label>
      <input type="password" id="login-password" class="field-input" placeholder="Masukkan password" required>
      <div id="login-error" class="login-error" style="display:none;"></div>
      <button type="submit" class="btn btn-primary btn-block">Masuk</button>
    </form>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app-shell" class="app-shell" style="display:none;">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-school">SDIT ANNIHAYAH</span>
      <span class="topbar-ta" id="topbar-ta">TA —</span>
    </div>
    <div class="topbar-user">
      <span id="topbar-username">—</span>
      <span class="topbar-role" id="topbar-role">—</span>
      <button id="btn-logout" class="btn-logout" title="Keluar">⏻</button>
    </div>
  </header>

  <!-- Sidebar (desktop) -->
  <aside class="sidebar">
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>

  <!-- Main content -->
  <main class="main-content" id="main-content">
    <!-- halaman dirender di sini oleh app.js -->
  </main>

  <!-- Bottom nav (mobile) -->
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
